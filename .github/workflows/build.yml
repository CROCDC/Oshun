name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Core tests + 90% coverage gate
        run: ./gradlew -p verify test jacocoTestCoverageVerification --stacktrace

      - name: App unit tests (JVM + Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: App unit coverage report
        run: ./gradlew :app:jacocoMergedReport --stacktrace

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            verify/build/reports/jacoco/test/html
            app/build/reports/jacoco/jacocoMergedReport/html
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oshun-gps-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests + merged coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest testDebugUnitTest jacocoMergedReport --stacktrace

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-instrumented
          path: app/build/reports/jacoco/jacocoMergedReport/html
          if-no-files-found: warn
