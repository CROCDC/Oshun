name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Core tests + 90% coverage gate
        run: ./gradlew -p verify test jacocoTestCoverageVerification

      - name: App unit tests (JVM + Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: App unit coverage report
        run: ./gradlew :app:jacocoMergedReport

      - name: Coverage summary
        if: always()
        run: |
          python3 ci/coverage_summary.py verify/build/reports/jacoco/test/jacocoTestReport.xml "Core (unit)"
          python3 ci/coverage_summary.py app/build/reports/jacoco/merged.xml "App (unit)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            verify/build/reports/jacoco/test/html
            app/build/reports/jacoco/mergedHtml
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests + coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            # Run the unit tests here too so jacocoMergedReport sees BOTH execution
            # data sets (.exec + .ec). The jobs run on separate runners, so without
            # this the "merged" report only ever covered the emulator run.
            ./gradlew testDebugUnitTest
            ./gradlew jacocoMergedReport

      - name: Coverage summary (merged unit + instrumented)
        if: always()
        run: python3 ci/coverage_summary.py app/build/reports/jacoco/merged.xml "App (merged)"

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-instrumented
          path: app/build/reports/jacoco/mergedHtml
          if-no-files-found: warn

  apk:
    name: Build APK
    needs: [unit, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oshun-gps-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases (latest)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Oshun — APK de debug (último)
          prerelease: true
          body: |
            APK de debug del último build verde (pasó unit + instrumentados).
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
