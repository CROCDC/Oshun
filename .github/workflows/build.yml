name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Core tests + 90% coverage gate
        run: ./gradlew -p verify test jacocoTestCoverageVerification

      - name: App unit tests (JVM + Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: App unit coverage report
        run: ./gradlew :app:jacocoMergedReport

      - name: Failing tests
        if: failure()
        run: python3 ci/failing_tests.py app/build/test-results verify/build/test-results

      - name: Coverage summary
        if: always()
        run: |
          python3 ci/coverage_summary.py verify/build/reports/jacoco/test/jacocoTestReport.xml "Core (unit)"
          python3 ci/coverage_summary.py app/build/reports/jacoco/merged.xml "App (unit)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            verify/build/reports/jacoco/test/html
            app/build/reports/jacoco/mergedHtml
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests + coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            # Run the unit tests here too so jacocoMergedReport sees BOTH execution
            # data sets (.exec + .ec). The jobs run on separate runners, so without
            # this the "merged" report only ever covered the emulator run.
            ./gradlew testDebugUnitTest
            ./gradlew jacocoMergedReport

      - name: Failing tests
        if: failure()
        run: |
          python3 ci/failing_tests.py \
            app/build/test-results \
            app/build/outputs/androidTest-results

      - name: Coverage summary (merged unit + instrumented)
        if: always()
        run: python3 ci/coverage_summary.py app/build/reports/jacoco/merged.xml "App (merged)"

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-instrumented
          path: app/build/reports/jacoco/mergedHtml
          if-no-files-found: warn

  apk:
    name: Build APK
    # A pull request builds the same commit its own branch already pushed, so opening one
    # would assemble the APK twice for nothing.
    if: github.event_name != 'pull_request'
    needs: [unit, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug -PgitSha=${{ github.sha }} -PversionCode=${{ github.run_number }}

      # The name carries the build, so a phone that has downloaded before gets a new file
      # instead of "app-debug (3).apk", and the file itself says which build it is.
      - name: Name the APK after its build
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/oshun-${{ github.run_number }}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oshun-gps-bridge-debug
          path: app/build/outputs/apk/debug/oshun-${{ github.run_number }}.apk
          if-no-files-found: error

      # Only develop moves the "latest" download. Every branch still gets its APK as a
      # workflow artifact above; publishing those would hand anyone following the Releases
      # link an unreviewed build, which is what the link is trusted not to be.
      - name: Publish APK to Releases (latest)
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Oshun — APK de debug (último)
          prerelease: true
          body: |
            APK de debug del último build verde (pasó unit + instrumentados).
            Commit: ${{ github.sha }}
            versionCode: ${{ github.run_number }}

            Se instala encima de la versión anterior sin desinstalar.
          files: app/build/outputs/apk/debug/oshun-${{ github.run_number }}.apk

      # A name per build means a new asset every time, so the older ones have to go or the
      # release piles up an APK per green build for ever. After the upload and never before:
      # a failed publish must not leave the download button pointing at nothing.
      - name: Drop the older APKs from the release
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="oshun-${{ github.run_number }}.apk"
          for asset in $(gh release view debug-latest --json assets -q '.assets[].name'); do
            [ "$asset" = "$keep" ] || gh release delete-asset debug-latest "$asset" --yes
          done
